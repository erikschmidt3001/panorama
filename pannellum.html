<!DOCTYPE HTML>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tour</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.7/build/pannellum.css"/>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/pannellum@2.5.7/build/pannellum.js"></script>
    <style>
    #panorama {
        width: 600px;
        height: 400px;
    }
    </style>
</head>
<body>

<div id="panorama"></div>
<script>
pannellum.viewer('panorama', {   
    "default": {
        "firstScene": "ground-riihintupa-northeast",
        "author": "Erik Schmidt",
        "sceneFadeDuration": 1000
    },

    "scenes": {
        "ground-riihintupa-northeast": {
            "title": "Riihintupa-Northeast",
            "hfov": 110,
            "pitch": -3,
            "yaw": 117,
            "type": "equirectangular",
            "panorama": "/images/ground-riihintupa-northeast.jpeg",
            "hotSpots": [
                {
                    "pitch": -2.1,
                    "yaw": 132.9,
                    "type": "scene",
                    "text": "Riihintupa-Roof",
                    "sceneId": "ground-riihintupa-roof"
                }
            ]
        },

        "ground-riihintupa-roof": {
            "title": "Riihintupa-Roof",
            "hfov": 110,
            "yaw": 5,
            "type": "equirectangular",
            "panorama": "/images/ground-riihintupa-roof.jpeg",
            "hotSpots": [
                {
                    "pitch": -0.6,
                    "yaw": 37.1,
                    "type": "scene",
                    "text": "Riihintupa-Northeast",
                    "sceneId": "ground-riihintupa-northeast",
                    "targetYaw": -23,
                    "targetPitch": 2
                }
            ]
        }
    }
});
</script>

</body>
</html>
